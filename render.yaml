services:
  - type: web
    name: saarthi
    runtime: node
    region: singapore
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: saarthi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/saarthi.db
      - key: SESSION_DAYS
        value: "14"
      - key: SESSION_SECRET
        generateValue: true
